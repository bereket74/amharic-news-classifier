[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amharic-news-classifier"
version = "0.1.0"
description = "Reproducible six-category Amharic news classification benchmark and demo"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AI Portfolio Project"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "torch>=2.5,<3",
  "transformers>=4.45,<5",
  "huggingface-hub>=0.25,<1",
  "safetensors>=0.4,<1",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
demo = ["gradio>=5.0,<7"]
test = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
